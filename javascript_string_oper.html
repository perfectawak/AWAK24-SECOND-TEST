<!DOCTYPE html>

<body>
   
    <h1> JavaScript string operators</h1>
   
   <h2> The <b>+=</b> operator </h2>

   <p> The assignment operators <b>+=</b> can concatenate strings.</p>

   <p id="demo"></p>

   <script>
    let text1 = "what a very ";
    text1 += "nice day";

    document.getElementById("demo").innerHTML = text1;
     
   </script>
</body>
</html>
