<!DOCTYPE html>
<html>
 <head>
    <style>
        table,th,td{
            border:1px solid green;
            border-collapse: collapse;
        }
        th,td{
            padding-top: 10px;
            padding-bottom: 20px;
            padding-left: 30px;
            padding-right: 40px;
        }
    </style>
 </head> 
 <body>
    <h2>Cellpadding-top-bottom-left-right</h2>
    <p>we can specify different padding for all four side of the cell content.</p>
   
  <table style="width: 100%;">
    <tr>
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Age</th>
    </tr>
    <tr>
        <td>Jill</td>
        <td>smith</td>
        <td>50</td>
    </tr>
    <tr>
        <td>Eve</td>
        <td>Jackson</td>
        <td>94</td>
    </tr>
    <tr>
        <td>John</td>
        <td>Deo</td>
        <td>80</td>
    </tr>
  </table>
 </body>  
</html>
