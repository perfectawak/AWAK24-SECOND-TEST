<!DOCTYPE html>
<html>
 <head>
  <title>TABLE CAPTION</title>
  <style>
    table,th,td{
      border: 1px solid black;
      border-collapse: collapse;
    }
    th,td{
      padding: 3px;
      text-align: center;
    }
  </style>
  </head>
  <body>
    <h2> Table caption </h2>
    <p> To add a caption to a table,use the caption tag.</p>
    <table style="width: 100%;">
      <caption>Monthly savings</caption>
      <tr>
        <th>month</th>
        <th>Savings</th>
      </tr>
      <tr>
        <td>January</td>
        <td>$100</td>
      </tr>
      <tr>
        <td>february</td>
        <td>$50</td>
      </tr>
    </table>
  </body>

 </head>
</html>
